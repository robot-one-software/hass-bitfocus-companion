        number:
          min: 1
          max: 999
          mode: box
    row:
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 99
          mode: box
    column:
      required: true
      example: 2
      selector:
        number:
          min: 0
          max: 99
          mode: box
    server:
      required: false
      example: "Companion (Studio-Mac)"
      selector:
        text:

