press:
  target:
    entity:
      integration: bitfocus_companion
      domain:
      - button
      - image
  fields:
    by_position:
      collapsed: true
      fields:
        page:
          required: false
          example: 1
          selector:
            number:
              min: 1
              max: 999
              mode: box
        row:
          required: false
          example: 0
          selector:
            number:
              min: 0
              max: 99
              mode: box
        column:
          required: false
          example: 2
          selector:
            number:
              min: 0
              max: 99
              mode: box
        server:
          required: false
          example: Companion (Studio-Mac)
          selector:
            text: null
