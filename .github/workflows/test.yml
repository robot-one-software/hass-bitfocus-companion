name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-test.txt ruff
      - run: ruff check --select E,F,W,I,B,UP --target-version py313 --line-length 120 custom_components tests
      - run: python -m pytest -q
