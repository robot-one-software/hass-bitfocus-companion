name: Release

# Pushing a tag like v0.6.0 publishes a GitHub release with the matching
# CHANGELOG section as its notes. HACS lists versions from releases.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check manifest version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json; print(json.load(open('custom_components/bitfocus_companion/manifest.json'))['version'])")
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest" >&2
            exit 1
          fi

      - name: Extract release notes from CHANGELOG.md
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import re, sys
          tag = sys.argv[1].lstrip("v")
          text = open("CHANGELOG.md").read()
          match = re.search(rf"^## {re.escape(tag)}\b.*?\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          notes = match.group(1).strip() if match else f"Release {sys.argv[1]}"
          open("RELEASE_NOTES.md", "w").write(notes + "\n")
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
